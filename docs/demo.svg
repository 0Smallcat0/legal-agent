  <text x="440" y="23" text-anchor="middle" fill="#8b949e" font-size="13">python -m legal_agent.run  ·  free local llama3.1  ·  2,560 條 + 1,367 判決</text>

  <g>
    <text x="20" y="72"><tspan fill="#3fb950">$</tspan><tspan fill="#c9d1d9"> python -m legal_agent.run</tspan></text>

    <text x="20" y="104"><tspan fill="#58a6ff">你 &gt;</tspan><tspan fill="#c9d1d9"> 樓上鄰居三更半夜狂敲打、搬東西，我報過警但沒用</tspan></text>
    <text x="20" y="128"><tspan fill="#8b949e">助理 &gt; 1. 噪音主要是什麼？ 2. 大多什麼時段？持續還是偶發？</tspan></text>
    <text x="20" y="152"><tspan fill="#58a6ff">你 &gt;</tspan><tspan fill="#c9d1d9"> 深夜喧嘩、拖家具聲 / 半夜，幾乎每天，持續一年多</tspan></text>
    <text x="20" y="176" fill="#6e7681" font-size="13">…事實齊備（6 欄位）後，只檢索一次，再依五道防線作答…</text>

    <text x="20" y="212" fill="#8b949e">══════════════ 診斷結果 ══════════════</text>
    <text x="20" y="236" fill="#c9d1d9">法律明文：社會秩序維護法第72條——製造噪音或深夜喧嘩，</text>
    <text x="20" y="258" fill="#c9d1d9">　　　　　妨害公眾安寧、不聽禁止者，處一萬元以下罰鍰。</text>
    <text x="20" y="282" fill="#c9d1d9">實務見解：（非法律明文，僅供參考）警察／環保／建管分工…</text>

    <text x="20" y="318"><tspan fill="#f85149">⚠ 引用查核（3 筆有疑慮）</tspan></text>
    <text x="20" y="342"><tspan fill="#f85149">  噪音管制法第8條、第9條、公寓大廈管理條例第16條：</tspan></text>
    <text x="20" y="366"><tspan fill="#f85149">  未出現在本次檢索結果中 — 模型可能憑記憶補充。</tspan></text>
    <text x="20" y="390"><tspan fill="#f85149">  該條文確實存在於資料庫，但本次未被檢索到，不採信。</tspan></text>
    <text x="612" y="342" fill="#d29922" font-size="12.5">← 8B 憑記憶補條文</text>
    <text x="612" y="390" fill="#6e7681" font-size="12.5">← 分辨「不存在」</text>
    <text x="612" y="410" fill="#6e7681" font-size="12.5">　與「沒被檢索到」</text>

    <text x="20" y="440" fill="#c9d1d9">建議處理順序（由低成本 → 高，打官司最後）：</text>
    <text x="20" y="464" fill="#8b949e">  1. 反映管委會      [已嘗試]      免費 · 即時~數日</text>
    <text x="20" y="486" fill="#8b949e">  2. 報警請警察到場  [已嘗試]      免費 · 即時</text>
    <text x="20" y="508"><tspan fill="#3fb950">  3. 里長／調解委員會 [建議下一步]  免費 · 數週</tspan></text>
    <text x="20" y="530" fill="#8b949e">  4. 存證信函 …　5. 民事訴訟（最後手段）</text>
  </g>

  <text x="20" y="552" fill="#6e7681" font-size="12.5">the model errs — the user knows.  retrieval-first · five gates · verified against a time-versioned corpus</text>
