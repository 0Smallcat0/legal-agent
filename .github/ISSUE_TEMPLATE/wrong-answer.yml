name: 答錯了 / 法條不相關 (Wrong answer or off-topic articles)
description: 一次諮詢的法條或回答不對。這是最有用的回報。
labels: ["wrong-answer"]
body:
  - type: markdown
    attributes:
      value: |
        最有用的是**你當時輸入的原話**，不用整理成法律用語：很多問題都出在系統沒認出一般人的說法。

        這裡是公開的，請不要貼姓名、地址、電話這類個人資料。
  - type: textarea
    id: input
    attributes:
      label: 你輸入的原話 (What you typed, verbatim)
      description: 照原樣貼上，不用修改。如果有回答它追問的問題，也一起貼上。
      placeholder: 退租三個月了房東還是不退押金，說要抵修繕費，但我搬走前有拍照
    validations:
      required: true
  - type: textarea
    id: got
    attributes:
      label: 它的回答 (What came back)
      description: 貼上「法律明文」那一段；能的話也貼答案下面列出的法條清單。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 應該出現哪一條 (Which article should have been there)
      description: 知道的話寫出來（例如 民法第455條）。只覺得不對、說不出哪一條也沒關係，照樣很有用。
    validations:
      required: false
  - type: dropdown
    id: shape
    attributes:
      label: 比較像哪一種 (Which of these fits, if any)
      description: 用猜的就好。
      options:
        - 整個答非所問 (The window answered the wrong question entirely)
        - 對的法條有出現，但回答沒用到 (The right articles were there but the answer ignored them)
        - 少了對方會拿來主張的那一條 (The article the other side relies on was missing)
        - 我已經說不是那樣，它還照那樣答 (It agreed with a premise I had already ruled out)
        - 一部不相關的法規佔了大半 (An irrelevant statute took up most of the window)
        - 不確定 (Not sure)
    validations:
      required: false
  - type: input
    id: backend
    attributes:
      label: 在哪裡用的 (Where you ran it)
      description: 網頁版就寫「網頁版」；在自己電腦上跑的，寫用的模型（例如 ollama / llama3.1）。
      placeholder: 網頁版
    validations:
      required: false
