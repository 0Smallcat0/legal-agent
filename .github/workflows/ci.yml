name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install the package
        run: pip install .[dev,demo]
      - name: Lint
        run: python -m ruff check legal_agent app.py tests
      - name: Build the corpus
        # Before the tests, not after: the tests that compare published numbers
        # against the shipped corpus need it, and used to skip silently here.
        run: python -c "import legal_agent; legal_agent.ensure_corpus()"
      - name: Run tests
        # Includes the blindspots suite: every case in evals/blindspots_v1.json
        # and the positive-control file, with the four still-blind cases
        # xfail(strict=True) in tests/test_verifier.py.
        run: python -m pytest -q
      - name: Verifier mutation coverage (full corpus)
        # __main__ exits non-zero on any missed mutation, any control or
        # per-axis positive-control false positive, or any kind that generates
        # zero cases on the shipped corpus.
        run: python -m legal_agent.evaluation.mutation
      - name: Verifier mutation coverage (retrieval-first)
        # Production call shape (dialogue/stage3.py). Gated only on the
        # retrieval_miss_quoted status line; the other axes run hot in this
        # mode by design (see evals/RESULTS.md). pipefail so the harness's own
        # exit code survives the tee.
        shell: bash
        run: |
          set -o pipefail
          python -m legal_agent.evaluation.mutation --retrieval-first | tee retrieval_first_output.txt
          grep -q "retrieval_miss_quoted" retrieval_first_output.txt
      - name: Citation blindspots (structural axes)
        # Exits non-zero on any control / positive-control false positive, an
        # uncaught miss outside STILL_BLIND, or a STILL_BLIND case now caught.
        run: python -m legal_agent.evaluation.blindspots
      - name: Qualifier gate audit (Tier-3 false-reject sweep)
        # Standing gate (CONTRIBUTING.md): exits non-zero on any false reject
        # or any laundering probe that is let through.
        run: python -m legal_agent.evaluation.qualifier_audit
      # Runs the INSTALLED package from a directory with no checkout in it,
      # so a corpus that only resolves from the repo root cannot come back.
      - name: Use the installed package outside the repo
        run: |
          mkdir -p "$RUNNER_TEMP/elsewhere"
          cd "$RUNNER_TEMP/elsewhere"
          python -c "
          import os, legal_agent
          assert legal_agent.ensure_corpus() > 2000, 'corpus did not ship with the package'
          results = legal_agent.verify('依公寀大廈管理條例第16條,住戶應維持安寧。')
          assert results and results[0].flagged, 'verifier did not flag an invented statute'
          assert legal_agent.retrieve('退租後房東不退押金'), 'retrieval returned nothing'
          print('installed package works from', os.getcwd())
          "
